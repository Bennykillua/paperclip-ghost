<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Option A: Bedsheet ghost</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Inter:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5E574C}a:hover{color:#1C1A17}
@keyframes drift{0%{transform:translate(0,0)}25%{transform:translate(4px,-3px)}50%{transform:translate(-3px,4px)}75%{transform:translate(5px,3px)}100%{transform:translate(0,0)}}
.drift{animation:drift 3.2s ease-in-out infinite}
</style>
</helmet>
<div style="width: 880px; height: 560px; box-sizing: border-box; padding: 36px 40px; background: #F6F1E7; font-family: Inter, system-ui, sans-serif; color: #1C1A17; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: Caveat, cursive; font-size: 44px; font-weight: 700; line-height: 1">A · Bedsheet</h1>
<p style="margin: 0; font-size: 14px; color: #5E574C">The classic sheet ghost with a wavy hem. Easiest to read as "ghost" at a glance. Move your mouse: the eyes follow.</p>
</div>
<div style="display: flex; gap: 40px; flex-grow: 1">
<div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5E574C">Normal</p>
<div style="flex-grow: 1; border: 2px solid #1C1A17; border-radius: 14px; background: #FBF8F1; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative">
<svg width="190" height="228" viewBox="0 0 200 240" role="img" aria-label="Doodled sheet ghost with googly eyes, waving">
<defs><filter id="wobA1"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="1"><animate attributeName="seed" values="1;2;3;4" dur="0.6s" repeatCount="indefinite"></animate></feTurbulence><feDisplacementMap in="SourceGraphic" scale="3"></feDisplacementMap></filter></defs>
<g filter="url(#wobA1)" fill="none" stroke="#1C1A17" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M40 220 C40 120 50 40 100 40 C150 40 160 120 160 220 Q147 205 134 220 Q120 235 107 220 Q93 205 80 220 Q66 235 53 220 Q46 212 40 220 Z" fill="#FFFFFF"></path>
<path d="M44 140 Q22 132 18 108"></path>
<path d="M156 140 Q180 128 186 106"></path>
<path d="M90 150 Q100 158 110 150"></path>
</g>
<circle cx="82" cy="112" r="15" fill="#FFFFFF" stroke="#1C1A17" stroke-width="3"></circle>
<circle cx="118" cy="112" r="15" fill="#FFFFFF" stroke="#1C1A17" stroke-width="3"></circle>
<circle cx="{{p1x}}" cy="{{p1y}}" r="6.5" fill="#1C1A17"></circle>
<circle cx="{{p2x}}" cy="{{p2y}}" r="6.5" fill="#1C1A17"></circle>
</svg>
<div style="position: absolute; top: 20px; right: 18px; max-width: 150px; border: 2px solid #1C1A17; border-radius: 16px; padding: 8px 12px; background: #FFFFFF; font-family: Caveat, cursive; font-size: 20px; line-height: 1.1">You've had this tab open 40 min. Want a summary?</div>
</div>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8E1B14">Possessed</p>
<div style="flex-grow: 1; border: 2px solid #8E1B14; border-radius: 14px; background: #ECE3D2; display: flex; align-items: center; justify-content: center; position: relative">
<svg width="190" height="228" viewBox="0 0 200 240" role="img" aria-label="The same ghost in red ink, arms limp, staring">
<defs><filter id="wobA2"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="1"><animate attributeName="seed" values="1;2;3;4;5" dur="0.4s" repeatCount="indefinite"></animate></feTurbulence><feDisplacementMap in="SourceGraphic" scale="6"></feDisplacementMap></filter></defs>
<g filter="url(#wobA2)" fill="none" stroke="#8E1B14" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
<path d="M40 220 C40 120 50 40 100 40 C150 40 160 120 160 220 Q147 205 134 220 Q120 235 107 220 Q93 205 80 220 Q66 235 53 220 Q46 212 40 220 Z" fill="#F7EFE6"></path>
<path d="M44 140 Q36 165 40 188"></path>
<path d="M156 140 Q164 165 160 188"></path>
<path d="M92 152 L108 152"></path>
</g>
<circle cx="82" cy="112" r="15" fill="#FFFFFF" stroke="#8E1B14" stroke-width="3"></circle>
<circle cx="118" cy="112" r="15" fill="#FFFFFF" stroke="#8E1B14" stroke-width="3"></circle>
<circle cx="82" cy="112" r="6.5" fill="#1C1A17"></circle>
<g class="drift"><circle cx="118" cy="112" r="6.5" fill="#1C1A17"></circle></g>
</svg>
<div style="position: absolute; top: 20px; right: 18px; max-width: 150px; border: 2px solid #8E1B14; border-radius: 16px; padding: 8px 12px; background: #F7EFE6; color: #8E1B14; font-family: Caveat, cursive; font-size: 20px; line-height: 1.1">It's 2:14am. I saw what you deleted.</div>
</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dx: 0, dy: 0 };
    this.onMove = (e) => {
      const w = window.innerWidth || 1;
      const h = window.innerHeight || 1;
      const dx = Math.max(-1, Math.min(1, (e.clientX / w - 0.3) * 2));
      const dy = Math.max(-1, Math.min(1, (e.clientY / h - 0.5) * 2));
      this.setState({ dx: dx, dy: dy });
    };
  }
  componentDidMount() { window.addEventListener('mousemove', this.onMove); }
  componentWillUnmount() { window.removeEventListener('mousemove', this.onMove); }
  renderVals() {
    const ox = this.state.dx * 6;
    const oy = this.state.dy * 6;
    return { p1x: 82 + ox, p1y: 112 + oy, p2x: 118 + ox, p2y: 112 + oy };
  }
}
</script>
</body>
</html>
